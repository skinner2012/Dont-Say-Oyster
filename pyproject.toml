[project]
name = "dont-say-oyster"
version = "0.1.0"
description = "A Taboo-like guessing game about Taiwanese snacks, played by three local LLM agents."
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.26.0",
    "opencc-python-reimplemented>=0.1.7",
]

[project.scripts]
load-corpus = "dont_say_oyster.corpus:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dont_say_oyster"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["opencc"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-jsonschema>=4.26.0.20261006",
]
